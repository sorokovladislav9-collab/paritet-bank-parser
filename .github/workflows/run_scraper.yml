name: Weekly Banking Scraper

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-play-scraper itunes-app-scraper-dmi pandas matplotlib requests numpy

    - name: Run script
      run: python parse_banks.py

    - name: Save results
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Автоматическое обновление данных"
        file_pattern: 'banking_apps_history.csv dashboard_*.png'
