name: Weekly Banking Scraper

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-play-scraper itunes-app-scraper-dmi pandas matplotlib requests numpy

    - name: Run script
      run: python parse_banks.py

    - name: Save results
      run: |
        git config --global user.name 'Weekly BI Bot'
        git config --global user.email 'bot@github.com'
        git add banking_apps_history.csv dashboard_*.png
        git commit -m "Автоматическое обновление данных: $(date +'%Y-%m-%d')" || exit 0
        git push --force origin main


