    - name: Save results
      run: |
        # 1. Сначала подписываем бота
        git config --global user.name 'Weekly BI Bot'
        git config --global user.email 'bot@github.com'
        
        # 2. Индексируем новые файлы результатов (CSV и PNG дашборд)
        git add banking_apps_history.csv dashboard_*.png
        
        # 3. Делаем локальный коммит на виртуальной машине (ошибка сбросится)
        git commit -m "Автоматическое обновление данных" || exit 0
        
        # 4. Теперь безопасно забираем обновления из облака (без паники со стороны Git)
        git pull origin main --rebase
        
        # 5. Чисто пушим объединенную историю в ваш репозиторий
        git push https://${{ secrets.GITHUB_TOKEN }}@://github.com{{ github.repository }}.git main
