name: Weekly Banking Scraper

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-play-scraper itunes-app-scraper-dmi pandas matplotlib requests numpy

    - name: Run script
      run: python parse_banks.py

    - name: Save results
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add banking_apps_history.csv dashboard_*.png

        if git diff --cached --quiet; then
          echo "Нет изменений для коммита"
          exit 0
        fi

        git commit -m "Автоматическое обновление данных"
        git push
