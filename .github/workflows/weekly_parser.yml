name: Weekly Banking Scraper

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-play-scraper itunes-app-scraper-dmi pandas matplotlib requests numpy

    - name: Run script
      run: python parse_banks.py

    - name: Save results
      run: |
        # Синхронизируем ветку перед коммитом
        git pull origin main --rebase
        
        git config --global user.name 'Weekly BI Bot'
        git config --global user.email 'bot@github.com'
        git add banking_apps_history.csv dashboard_*.png
        git commit -m "Автоматическое обновление данных" || exit 0
        
        # Пушим напрямую через системный токен авторизации
        git push https://${{ secrets.GITHUB_TOKEN }}@://github.com{{ github.repository }}.git main
